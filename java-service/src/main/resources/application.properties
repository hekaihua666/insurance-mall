server.port=8088
server.address=127.0.0.1
spring.mvc.async.request-timeout=300000

spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:insurance_split}
spring.datasource.username=${DB_USER:insurance}
spring.datasource.password=${DB_PASSWORD:insurance123}

agent.base-url=${AGENT_BASE_URL:http://127.0.0.1:8001}

# JWT：密钥至少 32 字节（HS256 要求），生产环境通过环境变量注入
jwt.secret=${JWT_SECRET:insurance-demo-jwt-secret-key-change-me-in-production-2026}
jwt.ttl-hours=${JWT_TTL_HOURS:24}

# MyBatis-Plus：开启下划线转驼峰，product 表的 clause_name 才能映射到 clauseName
mybatis-plus.configuration.map-underscore-to-camel-case=true
# 需要自定义 SQL 时把日志级别调成 debug 可看到执行的语句
mybatis-plus.configuration.log-impl=org.apache.ibatis.logging.slf4j.Slf4jImpl
# 日志级别
logging.level.cn.study.insurance=info
# 打开 Mapper 层的 DEBUG 才能看到实际执行的 SQL 和参数
logging.level.cn.study.insurance.mapper=debug
